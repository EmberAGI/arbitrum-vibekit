name: Release Packages

on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Comma separated package overrides (agent-node, registry, contracts)"
        required: false
        type: string
  pull_request:
    paths:
      - "typescript/lib/agent-node/**"
      - "typescript/onchain-actions-plugins/registry/**"
      - "typescript/onchain-actions-plugins/contracts/**"
      - "typescript/scripts/**"
      - "typescript/release/**"
      - "typescript/.multi-releaserc.cjs"
      - ".github/workflows/release.yml"
  push:
    branches:
      - main
      - next

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    name: Detect release targets
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    outputs:
      has_changes: ${{ steps.targets.outputs.has_changes }}
      matrix: ${{ steps.targets.outputs.matrix }}
      selected: ${{ steps.targets.outputs.selected }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
      - name: Determine release targets
        id: targets
        env:
          RELEASE_PACKAGE_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.packages || '' }}
        run: |
          node ./scripts/detect-release-targets.mjs --output release-targets.json
          echo "matrix=$(jq -c '.matrix' release-targets.json)" >> "$GITHUB_OUTPUT"
          echo "selected=$(jq -c '.selected' release-targets.json)" >> "$GITHUB_OUTPUT"
          echo "has_changes=$(jq -r '((.selected | length) > 0)|tostring' release-targets.json)" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate release (dry-run)
    needs: prepare
    if: github.event_name == 'pull_request' && needs.prepare.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Setup test environment
        if: contains(fromJson(needs.prepare.outputs.selected), 'agent-node')
        working-directory: typescript/lib/agent-node
        run: cp .env.test.example .env.test
      - name: Build agent-node
        if: contains(fromJson(needs.prepare.outputs.selected), 'agent-node')
        run: pnpm --filter @emberai/agent-node build
      - name: Test agent-node
        if: contains(fromJson(needs.prepare.outputs.selected), 'agent-node')
        run: pnpm --filter @emberai/agent-node test:ci
      - name: Build registry
        if: contains(fromJson(needs.prepare.outputs.selected), 'registry')
        run: pnpm --filter @emberai/onchain-actions-registry build
      - name: Test registry
        if: contains(fromJson(needs.prepare.outputs.selected), 'registry')
        run: pnpm --filter @emberai/onchain-actions-registry test:ci
      - name: Build contracts
        if: contains(fromJson(needs.prepare.outputs.selected), 'contracts')
        run: pnpm --filter @emberai/onchain-actions-contracts build
      - name: Test contracts
        if: contains(fromJson(needs.prepare.outputs.selected), 'contracts')
        run: pnpm --filter @emberai/onchain-actions-contracts test:ci
      - name: Prepare registry npm publish folder
        if: contains(fromJson(needs.prepare.outputs.selected), 'registry')
        run: node scripts/prepare-npm-publish.mjs --package onchain-actions-plugins/registry/package.json
      - name: Prepare contracts npm publish folder
        if: contains(fromJson(needs.prepare.outputs.selected), 'contracts')
        run: node scripts/prepare-npm-publish.mjs --package onchain-actions-plugins/contracts/package.json
      - name: Validate release (dry-run)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_DRY_RUN: "true"
        run: pnpm release -- --dry-run --packages agent-node registry contracts --summary-file release-summary-dry-run.json

  release:
    name: Publish release packages
    needs: prepare
    if: github.event_name != 'pull_request' && needs.prepare.outputs.has_changes == 'true'
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Setup test environment
        if: contains(fromJson(needs.prepare.outputs.selected), 'agent-node')
        working-directory: typescript/lib/agent-node
        run: cp .env.test.example .env.test
      - name: Build agent-node
        if: contains(fromJson(needs.prepare.outputs.selected), 'agent-node')
        run: pnpm --filter @emberai/agent-node build
      - name: Test agent-node
        if: contains(fromJson(needs.prepare.outputs.selected), 'agent-node')
        run: pnpm --filter @emberai/agent-node test:ci
      - name: Build registry
        if: contains(fromJson(needs.prepare.outputs.selected), 'registry')
        run: pnpm --filter @emberai/onchain-actions-registry build
      - name: Test registry
        if: contains(fromJson(needs.prepare.outputs.selected), 'registry')
        run: pnpm --filter @emberai/onchain-actions-registry test:ci
      - name: Build contracts
        if: contains(fromJson(needs.prepare.outputs.selected), 'contracts')
        run: pnpm --filter @emberai/onchain-actions-contracts build
      - name: Test contracts
        if: contains(fromJson(needs.prepare.outputs.selected), 'contracts')
        run: pnpm --filter @emberai/onchain-actions-contracts test:ci
      - name: Prepare registry npm publish folder
        if: contains(fromJson(needs.prepare.outputs.selected), 'registry')
        run: node scripts/prepare-npm-publish.mjs --package onchain-actions-plugins/registry/package.json
      - name: Prepare contracts npm publish folder
        if: contains(fromJson(needs.prepare.outputs.selected), 'contracts')
        run: node scripts/prepare-npm-publish.mjs --package onchain-actions-plugins/contracts/package.json
      - name: Run multi-semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm release -- --packages agent-node registry contracts --summary-file release-summary.json
      - name: Generate release tweet copy
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node scripts/release-tweet-copy.mjs release-summary.json
      - name: Upload release summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-summary
          path: typescript/release-summary.json
          if-no-files-found: warn
